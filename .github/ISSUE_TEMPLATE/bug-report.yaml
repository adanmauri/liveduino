---
name: "🐛 Bug Report"
description: Report something that is not working as expected
title: "(short issue description)"
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What is the problem? A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen? For Arduino calls, what the same call does in a sketch.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current Behavior
      description: |
        What actually happened?

        Please include the full traceback and, for protocol problems, the bytes exchanged if you
        have them.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: |
        A short, self-contained Python snippet we can copy, run and reproduce, plus the wiring if
        it matters (what is connected to which pin).
      render: python
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Possible Solution
      description: Suggest a fix or a reason for the bug.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Information/Context
      description: Anything else that might be relevant for troubleshooting this bug.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: liveduino version
      description: "`pip show liveduino` or `uv pip show liveduino`."
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Board, connection and firmware
      description: "For example: Arduino UNO R3, serial over USB, bundled StandardFirmata 2.5.9."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment details (OS name and version, Python version)
    validations:
      required: true
