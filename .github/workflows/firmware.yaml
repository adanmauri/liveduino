---
name: Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/liveduino/boards/catalog/**
      - src/liveduino/firmware/**
      - scripts/build_firmware.py
      - .github/workflows/firmware.yaml
  pull_request:
    branches:
      - main
    paths:
      - src/liveduino/boards/catalog/**
      - src/liveduino/firmware/**
      - scripts/build_firmware.py
      - .github/workflows/firmware.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify bundled firmware is up to date
    # The regenerate job handles manual rebuilds; this job guards push/PR drift.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv (with cache)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-default-groups

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Install pinned Arduino core and libraries
        run: make firmware-setup

      - name: Build firmware
        env:
          # Keep the runtime-only environment installed above.
          UV_NO_SYNC: "1"
        run: make firmware

      - name: Fail if bundled firmware changed
        run: |
          git add -A src/liveduino/firmware
          if ! git diff --cached --exit-code -- src/liveduino/firmware; then
            echo "::error::Bundled firmware is out of date. Run 'make firmware' and commit the result."
            exit 1
          fi

  regenerate:
    name: Regenerate firmware and open PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv (with cache)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-default-groups

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0

      - name: Install pinned Arduino core and libraries
        run: make firmware-setup

      - name: Build firmware
        env:
          # Keep the runtime-only environment installed above.
          UV_NO_SYNC: "1"
        run: make firmware

      - name: Open pull request with updated firmware
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: firmware/rebuild
          title: "chore(firmware): rebuild bundled StandardFirmata images"
          commit-message: "chore(firmware): rebuild bundled StandardFirmata images"
          body: |
            Automated rebuild of the bundled StandardFirmata firmware images via
            `make firmware` (arduino-cli). Review the updated `.hex` files and
            `manifest.json` under `src/liveduino/firmware/`.
          add-paths: src/liveduino/firmware
